<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AC Security Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --n1:#0f2b46;--n2:#1e6f8e;--n3:#2a8fb0;
  --btn:#1a5f7d;--btn2:#134a63;--btnH:#0f2b46;
  --gold:#f5c842;--white:#fff;--muted:rgba(255,255,255,.65);
  --shadow:0 3px 12px rgba(0,0,0,.25);--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'DM Sans','Noto Sans TC','Noto Sans Khmer',system-ui,sans-serif;overflow-x:hidden}
body{
  background:linear-gradient(160deg,#0f2b46 0%,#1e6f8e 48%,#134a63 100%);
  min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;padding:12px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:
    radial-gradient(circle at 15% 25%, #fff 2px, transparent 2px),
    radial-gradient(circle at 85% 70%, #fff 2px, transparent 2px),
    radial-gradient(circle at 45% 80%, #fff 1.5px, transparent 1.5px),
    radial-gradient(circle at 75% 15%, #fff 1.5px, transparent 1.5px),
    radial-gradient(circle at 30% 60%, #fff 1px, transparent 1px),
    radial-gradient(circle at 60% 40%, #fff 1px, transparent 1px);
  background-size:160px 160px;
}
.wrap{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1;margin:auto}

/* Header */
.portal-hdr{
  background:rgba(0,0,0,.18);border-radius:var(--r);padding:14px 16px;
  display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);
}
.ph-icon{font-size:28px}
.ph-text .t1{font-size:16px;font-weight:800;color:var(--white);letter-spacing:.3px}
.ph-text .t2{font-size:10px;color:var(--muted);margin-top:1px;letter-spacing:.08em;text-transform:uppercase}
.ph-right{margin-left:auto;display:flex;gap:4px}

.lang-sw{display:flex;background:rgba(0,0,0,.2);border-radius:9px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.lb{min-height:44px;min-width:42px;padding:0 8px;border:none;background:transparent;color:rgba(255,255,255,.8);cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:.15s}
.lb.on{background:var(--gold);color:#0f2b46}

/* Cloud bar */
.cloud-bar{
  background:rgba(0,0,0,.15);border-radius:10px;padding:9px 14px;
  display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.1);
  font-size:11px;color:var(--muted);cursor:pointer;
}
.cloud-bar:hover{background:rgba(0,0,0,.26)}
.c-dot{width:7px;height:7px;border-radius:50%;background:#9ca3af;flex-shrink:0;transition:.3s}
.c-dot.ok{background:#4ade80;box-shadow:0 0 6px #4ade80}
.c-dot.err{background:#f87171}
.c-dot.syncing{background:#fbbf24;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1s linear infinite}
.c-lbl{font-weight:700;color:rgba(255,255,255,.85);font-size:11px}
.cloud-bar.offline{background:rgba(153,27,27,.6);border-color:rgba(254,202,202,.5)}
.cloud-bar.offline .c-lbl{color:#fff}
.c-ts{font-size:10px;margin-left:auto;font-family:'DM Mono',monospace}

/* Module grid */
.mod-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mod-btn{
  background:linear-gradient(160deg,var(--btn),var(--btn2));
  border:1px solid rgba(255,255,255,.13);border-radius:var(--r);
  padding:13px 10px 11px;text-decoration:none;color:var(--white);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:var(--shadow);transition:.16s;position:relative;overflow:hidden;
}
.mod-btn::after{
  content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.11),transparent 55%);pointer-events:none;
}
.mod-btn:hover{transform:translateY(-2px);background:linear-gradient(160deg,#2a8fb0,var(--btn))}
.mod-btn:active{transform:scale(.97)}
.mod-btn.full{grid-column:1/-1;flex-direction:row;justify-content:center;gap:9px;padding:12px;
  background:linear-gradient(120deg,#8a6d1f,#c8a02e);border-color:rgba(245,200,66,.4)}
.mod-btn.full:hover{background:linear-gradient(120deg,#a8842a,#e0b73a)}
.mb-ic{font-size:21px;line-height:1}
.mb-t1{font-size:12px;font-weight:800;letter-spacing:.2px;text-align:center;line-height:1.25}
.mb-t2{font-size:9px;color:rgba(255,255,255,.62);letter-spacing:.04em;text-align:center}
.mb-n{
  position:absolute;top:5px;right:7px;font-size:9px;font-family:'DM Mono',monospace;
  background:rgba(0,0,0,.3);border-radius:20px;padding:1px 6px;color:var(--gold);font-weight:700;
}

/* 首頁雲端同步：全部同步／勾選同步（2026-10-15） */
.sync-box{background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:9px;display:flex;flex-direction:column;gap:7px}
.sync-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:#fff;padding:0 2px}
.sync-h .sync-pick{margin-left:auto;background:none;border:none;color:var(--gold);font:700 11px/1 inherit;font-family:inherit;cursor:pointer;min-height:32px;padding:0 4px}
.sync-chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.sc{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px 7px;min-height:44px;cursor:pointer;color:#fff;font-size:11.5px;font-weight:700;position:relative;overflow:hidden}
.sc input{width:16px;height:16px;accent-color:#f5c842;flex-shrink:0;margin:0}
.sc.on{background:rgba(42,143,176,.38);border-color:rgba(245,200,66,.55)}
.sc .sc-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.sc .sc-t small{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'DM Mono','Noto Sans TC',monospace}
.sc.run{border-color:#fbbf24}.sc.run small{color:#fde68a}
.sc.ok small{color:#86efac}.sc.err{border-color:#f87171;background:rgba(153,27,27,.45)}.sc.err small{color:#fecaca}
.sc.run::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:40%;background:#fbbf24;animation:scrun 1s linear infinite}
@keyframes scrun{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.sync-prog{height:6px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden;display:none}
.sync-prog.on{display:block}
.sync-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4ade80,#f5c842);transition:width .35s}
.sync-msg{font-size:11px;color:rgba(255,255,255,.85);min-height:0;padding:0 2px;line-height:1.45}
.sync-msg:empty{display:none}
.sync-act{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sync-act button{min-height:46px;border-radius:10px;border:1px solid rgba(255,255,255,.16);font:800 12px/1.2 inherit;font-family:inherit;cursor:pointer;color:#0f2b46;background:var(--gold)}
.sync-act button.alt{background:rgba(0,0,0,.22);color:#fff}
.sync-act button:disabled{opacity:.5;cursor:wait}
/* 首頁智慧匯入（2026-10-22） */
.hub-box{background:#fff;border-radius:var(--r);padding:10px;box-shadow:var(--shadow);color:#15293d}
.hub-h{display:flex;flex-direction:column;gap:2px;padding:0 2px 8px}.hub-h span{font-size:13px;font-weight:800;color:#0f2b46}.hub-h small{font-size:10.5px;color:#6b8398}
.hub-box .btn{min-height:40px;padding:6px 14px;border:none;border-radius:9px;background:#1e6f8e;color:#fff;font:700 12.5px/1.2 inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.hub-box .btn.gray{background:#64748b}.hub-box .btn.sm{min-height:36px;padding:5px 10px;font-size:11.5px}.hub-box .btn:disabled{opacity:.5;cursor:wait}
/* Quick actions */
/* 管理捷徑（與保安模組分開） */
.admin-box{background:rgba(0,0,0,.14);border:1px dashed rgba(255,255,255,.22);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px}
.admin-h{font-size:10.5px;font-weight:800;color:rgba(255,255,255,.72);letter-spacing:.06em;padding:0 2px}
.qa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.qa button{
  background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.11);border-radius:10px;min-height:52px;
  padding:9px 4px;color:var(--white);font-size:11px;font-weight:700;font-family:inherit;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.15s;
}
.qa button:disabled{opacity:.5;cursor:wait}
.qa button:hover{background:rgba(0,0,0,.34)}
.qa .qi{font-size:15px}

.foot{text-align:center;font-size:9.5px;color:rgba(255,255,255,.42);padding:4px 0 2px;letter-spacing:.05em}
#toastwrap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:2000;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 24px);max-width:440px}
.toast{background:#0f2b46;color:#fff;padding:10px 15px;border-radius:10px;font-size:12.5px;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);text-align:center;pointer-events:auto;cursor:pointer;position:relative;max-width:100%;word-break:break-word}
.toast.ok{background:#166534} .toast.err{background:#991b1b} .toast.warn{background:#92400e}
.toast.sticky{padding-right:32px;text-align:left}
.toast .toast-x{position:absolute;top:6px;right:10px;font-size:16px;opacity:.85}
.toast .toast-act{display:block;margin:8px auto 0;min-height:40px;padding:0 16px;border:1.5px solid rgba(255,255,255,.85);border-radius:9px;background:rgba(255,255,255,.14);color:#fff;font:700 13px/1 inherit;font-family:inherit;cursor:pointer}
@media(max-width:340px){.mod-grid{grid-template-columns:1fr}}
/* 共用設定視窗（sec-core 的 openSettings）在首頁也要有正確樣式 */
.mask{position:fixed;inset:0;background:rgba(15,43,70,.55);z-index:900;display:none;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(2px)}
.mask.on{display:flex}
.modal{--line:#e2e8f0;--ink:#15293d;--ink2:#5b7186;--n2:#1e6f8e;background:#fff;color:var(--ink);border-radius:15px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 6px 20px rgba(15,43,70,.3);font-size:14px;line-height:1.5}
.modal .mh{background:linear-gradient(135deg,#0f2b46,#1e6f8e);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:8px;border-radius:15px 15px 0 0;position:sticky;top:0;z-index:2}
.modal .mh b{font-size:14.5px;font-weight:800}
.modal .mh .x{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;width:40px;height:40px;border-radius:9px;cursor:pointer;font-size:18px;font-family:inherit}
.modal .mb{padding:15px}
.modal .mf{padding:11px 15px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;border-radius:0 0 15px 15px}
.modal .btn{min-height:44px;padding:8px 14px;border:none;border-radius:9px;background:#1e6f8e;color:#fff;cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.modal .btn.gh{background:#fff;color:#1e6f8e;border:1px solid #1e6f8e}
.modal .btn.gray{background:#64748b}
.modal .btn.sm{min-height:36px;padding:5px 10px;font-size:11.5px}
.modal .grid{display:grid;gap:10px}.modal .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal .sep{height:1px;background:var(--line);margin:11px 0}
.modal .hint{font-size:11px;color:#8ba0b3;line-height:1.6}
.modal .f{display:flex;flex-direction:column;gap:4px}.modal .f label{font-size:11px;font-weight:700;color:var(--ink2)}
.modal input,.modal select{padding:8px 10px;min-height:42px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);width:100%}
.modal .adv-toggle{margin-top:12px}
.modal .grid.g2{grid-template-columns:1fr 1fr}.modal .photo-choice{min-height:64px;justify-content:center}
</style>
</head>
<body>
<div class="wrap">

  <div class="portal-hdr">
    <div class="ph-icon">🛡️</div>
    <div class="ph-text">
      <div class="t1">AC Security</div>

    <div class="ph-right">

        <button class="lb on" data-l="zh" data-zh="繁中" data-en="ZH" data-km="ZH" data-tip-zh="繁體中文" data-tip-en="Chinese" data-tip-km="ភាសាចិន">繁中</button>

      <button type="button" onclick="act('anomalyReport', this)"><span class="qi">⚠️</span><span data-zh="異常報告" data-en="Anomaly report" data-km="របាយការណ៍មិនប្រក្រតី">異常報告</span></button>
      <button type="button" onclick="act('nightCheck', this)"><span class="qi">🌙</span><span data-zh="夜巡檢查" data-en="Night patrol check" data-km="ពិនិត្យល្បាតយប់">夜巡檢查</span></button>

      <button type="button" onclick="pullAll(this)"><span class="qi">☁️</span><span data-zh="檢查雲端" data-en="Check cloud" data-km="ពិនិត្យពពក">檢查雲端</span></button>
      <button type="button" onclick="openCfg()"><span class="qi">⚙️</span><span data-zh="設定" data-en="Settings" data-km="ការកំណត់">設定</span></button>

<script>
/* ═══ 模組定義（含本機筆數） ═══ */
var CLOUD = 'unknown';   /* unknown / checking / ok / offline */
function paintCloud() {
  var dot = document.getElementById('dot'), lbl = document.getElementById('cLbl'), bar = document.getElementById('cloudBar');
  var txt = {
    unknown:  SEC.L('☁ 雲端狀態：檢查中', '☁ Cloud status: checking', '☁ ស្ថានភាពពពក៖ កំពុងពិនិត្យ'),
    checking: SEC.L('☁ 雲端狀態：檢查中…', '☁ Cloud status: checking…', '☁ ស្ថានភាពពពក៖ កំពុងពិនិត្យ…'),
    ok:       SEC.L('✅ 雲端連線正常', '✅ Cloud connected', '✅ ភ្ជាប់ពពកបានល្អ'),
    offline:  SEC.L('📴 離線／未上雲（點一下重試）', '📴 Offline / not in cloud (tap to retry)', '📴 គ្មានអ៊ីនធឺណិត / មិនទាន់ដាក់ពពក (ចុចដើម្បីព្យាយាមម្តងទៀត)')
  }[CLOUD];
  if (lbl) lbl.textContent = txt;
  if (dot) dot.className = 'c-dot' + (CLOUD === 'ok' ? ' ok' : CLOUD === 'offline' ? ' err' : CLOUD === 'checking' ? ' syncing' : '');
  if (bar) bar.classList.toggle('offline', CLOUD === 'offline');
}
var MODS = [
  { id:'patrol',    u:'ac_sec_patrol_v2.html?v=20260904b',    ic:'🚨', zh:'保安巡邏', en:'Patrol',     km:'ល្បាត',
    sub:'PATROL',    keys:['ac_sec_patrol_db','ac_sec_patrol_scan','ac_sec_chipmap'] },
  { id:'cctv',      u:'ac_sec_cctv_v2.html?v=20260914a',         ic:'📷', zh:'CCTV 監控', en:'CCTV',      km:'កាមេរ៉ា',
    sub:'CCTV',      keys:['ac_sec_cctv_db','ac_sec_cctv_log'] },
  { id:'container', u:'ac_sec_container_v2.html?v=20260904c',    ic:'🚛', zh:'貨櫃出入', en:'Container',  km:'កុងតឺន័រ',
    sub:'CONTAINER', keys:['vrt_truck_v2','vr-container-inspections','vrt_v2'] },
  { id:'expense',   u:'ac_sec_expense_v1.html?v=20260901b',   ic:'💰', zh:'保安費用', en:'Expense',    km:'ចំណាយ',
    sub:'EXPENSE',   keys:['ac_sec_expense_db'] },
  { id:'attendance',u:'ac_sec_attendance_v2.html?v=20260914a',   ic:'🕐', zh:'保安出勤', en:'Attendance', km:'វត្តមាន',
    sub:'ATTENDANCE',keys:['ac_sec_att_db'] },

async function cnt(keys) {
  var n = 0;
  var vals = await Promise.all(keys.map(function (k) { return SEC.dbGet(k, null); }));
  vals.forEach(function (d) {
    if (Array.isArray(d)) n += d.length;
    else if (d && Array.isArray(d.records)) n += d.records.length;
    else if (d && typeof d === 'object') n += Object.keys(d).length;
  });
  return n;
}

async function renderGrid() {
  var L = SEC.lang();

  document.getElementById('grid').innerHTML = MODS.map(function (m, i) {
    var n = counts[i];
    return '<a class="mod-btn" href="' + m.u + '">' +
      (n ? '<span class="mb-n">' + (n > 9999 ? '9k+' : n) + '</span>' : '') +
      '<span class="mb-ic">' + m.ic + '</span>' +
      '<span class="mb-t1">' + (m[L] || m.zh) + '</span>' +

}

/* 綠色只在真的連上雲端之後；失敗一律紅色「離線／未上雲」。 */
async function ping(silent) {
  if (!navigator.onLine) { CLOUD = 'offline'; paintCloud(); if (!silent) SEC.toast(SEC.netFailText(), 'err', 0, { label: SEC.L('🔄 再試一次', '🔄 Try again', '🔄 ព្យាយាមម្តងទៀត'), fn: function () { pullAll(); } }); return false; }
  CLOUD = 'checking'; paintCloud();
  try {
    await SEC.gasPost({ action: 'ping' });
    CLOUD = 'ok'; paintCloud();
    document.getElementById('cTs').textContent = SEC.nowStr();
    if (!silent) SEC.toast(SEC.L('✅ 雲端連線正常', '✅ Cloud connected', '✅ ភ្ជាប់ពពកបានល្អ'), 'ok');
    return true;
  } catch (e) {
    CLOUD = 'offline'; paintCloud();
    if (!silent) SEC.toast('❌ ' + SEC.esc(e.message), 'err', 0, { label: SEC.L('🔄 再試一次', '🔄 Try again', '🔄 ព្យាយាមម្តងទៀត'), fn: function () { pullAll(); } });
    return false;
  }
}
var BUSY = false;
async function pullAll(btn) {
  if (BUSY) return; BUSY = true; if (btn) btn.disabled = true;
  try { await ping(false); } finally { BUSY = false; if (btn) btn.disabled = false; }
}
async function act(action, btn) {
  if (BUSY) return; BUSY = true; if (btn) btn.disabled = true;
  var t = SEC.toast('<span class="spin">⏳</span> ' + SEC.L('執行中…', 'Working…', 'កំពុងដំណើរការ…'), '', 0);
  try {
    await SEC.gasPost({ action: action, lang: SEC.lang() });
    CLOUD = 'ok'; paintCloud();
    SEC.toast(SEC.L('✅ 已送出，請看 Telegram 群組', '✅ Sent. Check the Telegram group.', '✅ បានផ្ញើ។ សូមមើលក្រុម Telegram។'), 'ok', 4000);
  } catch (e) {
    if (e && (e.code === 'NETWORK' || e.code === 'HTTP')) { CLOUD = 'offline'; paintCloud(); }
    SEC.toast('❌ ' + SEC.esc(e.message), 'err', 0, { label: SEC.L('🔄 再試一次', '🔄 Try again', '🔄 ព្យាយាមម្តងទៀត'), fn: function () { act(action, btn); } });
  } finally { if (t && t.parentNode) t.parentNode.removeChild(t); BUSY = false; if (btn) btn.disabled = false; }
}
/* ═══ 首頁雲端同步：全部同步／只同步勾選的模組 ═══
   每個模組在背景開自己的頁面，執行該頁同一套「先下載合併、再上傳」同步（與頁首 ⬆️⬇️ 相同），
   所以各模組的合併、刪除紀錄、照片、人員版本規則都一樣，不會因為從首頁同步而不同。
   一次一個模組，避免雲端鎖互搶；失敗的模組會留著勾選，可再按一次重試。 */
var SYNC_SEL_KEY = 'ac_sec_home_sync_sel_v1', SYNC_BUSY = false, SYNC_ST = {}, SYNC_TIMEOUT = 120000, SYNC_IDLE = 150000, SYNC_MAX = 1200000;
function syncSelRead() {
  try { var v = JSON.parse(localStorage.getItem(SYNC_SEL_KEY) || 'null'); if (Array.isArray(v)) return v.filter(function (id) { return MODS.some(function (m) { return m.id === id; }); }); } catch (e) {}
  return MODS.map(function (m) { return m.id; });
}
function syncSelWrite(ids) { try { localStorage.setItem(SYNC_SEL_KEY, JSON.stringify(ids)); } catch (e) {} }
var SYNC_SEL = syncSelRead();
function syncShortTime(t) { var m = String(t || '').match(/(\d{2}:\d{2})(?::\d{2})?\s*$/); var d = String(t || '').match(/\d{4}-(\d{2}-\d{2})/); return t && t !== '—' ? (d && d[1] !== SEC.ymd().slice(5) ? d[1] + ' ' : '') + (m ? m[1] : t) : ''; }
function paintSync() {
  var L = SEC.lang(), box = document.getElementById('syncChips'); if (!box) return;
  box.innerHTML = MODS.map(function (m) {
    var st = SYNC_ST[m.id] || {}, on = SYNC_SEL.indexOf(m.id) >= 0, sub;
    if (st.state === 'run') sub = '⏳ ' + (st.msg || SEC.L('同步中…', 'Syncing…', 'កំពុងធ្វើ…'));
    else if (st.state === 'wait') sub = '… ' + SEC.L('排隊中', 'Queued', 'កំពុងរង់ចាំ');
    else if (st.state === 'ok') sub = '✅ ' + (st.msg || syncShortTime(SEC.lastSync(m.id)));
    else if (st.state === 'err') sub = '❌ ' + (st.msg || SEC.L('失敗', 'Failed', 'បរាជ័យ'));
    else sub = syncShortTime(SEC.lastSync(m.id)) ? '☁ ' + syncShortTime(SEC.lastSync(m.id)) : '— ' + SEC.L('尚未同步', 'Not synced yet', 'មិនទាន់');
    return '<label class="sc' + (on ? ' on' : '') + (st.state ? ' ' + st.state : '') + '" title="' + SEC.esc(sub) + '"><input type="checkbox" data-sync="' + m.id + '"' + (on ? ' checked' : '') + (SYNC_BUSY ? ' disabled' : '') + '>' +
      '<span>' + m.ic + '</span><span class="sc-t"><span>' + SEC.esc(m[L] || m.zh) + '</span><small>' + SEC.esc(sub) + '</small></span></label>';
  }).join('');
  box.querySelectorAll('input[data-sync]').forEach(function (cb) {
    cb.onchange = function () {
      var id = cb.getAttribute('data-sync');
      SYNC_SEL = SYNC_SEL.filter(function (x) { return x !== id; }); if (cb.checked) SYNC_SEL.push(id);
      SYNC_SEL = MODS.map(function (m) { return m.id; }).filter(function (x) { return SYNC_SEL.indexOf(x) >= 0; });
      syncSelWrite(SYNC_SEL); paintSync();
    };
  });
  var all = SYNC_SEL.length === MODS.length, pick = document.getElementById('syncPick');
  pick.textContent = all ? SEC.L('全不選', 'Select none', 'មិនជ្រើសទាំងអស់') : SEC.L('全選', 'Select all', 'ជ្រើសទាំងអស់');
  pick.disabled = SYNC_BUSY;
  var a = document.getElementById('syncAllBtn'), b = document.getElementById('syncSelBtn');
  a.textContent = SYNC_BUSY ? '⏳ ' + SEC.L('同步中…', 'Syncing…', 'កំពុងធ្វើ…') : '☁ ' + SEC.L('全部同步', 'Sync all', 'ធ្វើទាំងអស់') + ' (' + MODS.length + ')';
  b.textContent = '☑ ' + SEC.L('同步勾選的', 'Sync selected', 'ធ្វើដែលបានជ្រើស') + ' (' + SYNC_SEL.length + ')';
  a.disabled = SYNC_BUSY; b.disabled = SYNC_BUSY || !SYNC_SEL.length;
  paintSyncResult();
}
document.getElementById('syncPick').onclick = function () {
  SYNC_SEL = SYNC_SEL.length === MODS.length ? [] : MODS.map(function (m) { return m.id; }); syncSelWrite(SYNC_SEL); paintSync();
};
document.getElementById('syncAllBtn').onclick = function () { syncModules(MODS.map(function (m) { return m.id; })); };
document.getElementById('syncSelBtn').onclick = function () { syncModules(SYNC_SEL.slice()); };
var SYNC_RESULT = null, SYNC_FAIL_TOAST = null;
/* 結果文字依目前語言重畫（切換語言後不會殘留別的語言） */
function paintSyncResult() {
  var msg = document.getElementById('syncMsg'), r = SYNC_RESULT; if (!msg || SYNC_BUSY || !r) return;
  var names = r.bad.map(function (id) { var m = MODS.filter(function (x) { return x.id === id; })[0]; return m ? (m[SEC.lang()] || m.zh) : id; });
  msg.textContent = (r.bad.length ? '⚠ ' : '✅ ') + SEC.L('完成 ' + r.ok + '/' + r.total, 'Done ' + r.ok + '/' + r.total, 'រួច ' + r.ok + '/' + r.total) +
    (r.bad.length ? ' · ❌ ' + names.join(SEC.lang() === 'zh' ? '、' : ', ') + ' · ' + SEC.L('已勾選失敗的，可再按「同步勾選的」', 'failed ones are selected — tap "Sync selected" to retry', 'បានជ្រើសដែលបរាជ័យ — ចុចម្តងទៀត') : '');
}
function syncSleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
async function syncWaitFor(fn, ms) {
  var end = Date.now() + ms;
  while (Date.now() < end) { try { if (fn()) return true; } catch (e) {} await syncSleep(150); }
  return false;
}
/* 在背景開一個模組頁，用該頁自己的同步流程跑一次，完成後關掉 */
function syncOne(m) {
  return new Promise(function (resolve) {
    var f = document.createElement('iframe'), done = false, started = false;
    f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1; f.title = 'sync ' + m.id;
    f.style.cssText = 'position:fixed;left:-12000px;top:0;width:400px;height:820px;border:0;opacity:0;pointer-events:none';
    /* 2026-10-24：不再固定 2 分鐘判逾時；模組還在傳（進度或網路請求有動）就繼續等，
       超過 SYNC_IDLE 沒有任何進展或總共超過 SYNC_MAX 才算逾時。 */
    var startAt = Date.now(), lastAct = Date.now(), lastSig = '';
    var timer = setInterval(function () {
      var sig = '';
      try {
        var w = f.contentWindow, p = w && w.SEC && w.SEC.syncProgress && w.SEC.syncProgress[m.id];
        var n = w && w.performance && w.performance.getEntriesByType ? w.performance.getEntriesByType('resource').length : 0;
        sig = (p ? p.phase + ':' + p.done + '/' + p.total + '@' + p.at : '') + '|' + n;
        if (p && p.total) { SYNC_ST[m.id] = { state:'run', msg:(p.phase === 'download' ? '⬇ ' : '⬆ ') + p.done + '/' + p.total }; paintSync(); }
      } catch (e) {}
      if (sig && sig !== lastSig) { lastSig = sig; lastAct = Date.now(); }
      if (Date.now() - lastAct > SYNC_IDLE || Date.now() - startAt > SYNC_MAX) finish({ ok:false, msg:SEC.L('逾時', 'Timed out', 'អស់ពេល') });
    }, 2000);
    function finish(r) {
      if (done) return; done = true; clearInterval(timer);
      setTimeout(function () { try { f.src = 'about:blank'; } catch (e) {} if (f.parentNode) f.parentNode.removeChild(f); }, 60);
      resolve(r);
    }
    f.onload = async function () {
      if (started || done) return; started = true;
      try {
        var w = f.contentWindow;
        try { w.performance.setResourceTimingBufferSize(20000); } catch (e) {}
        if (!(await syncWaitFor(function () { return w.SEC && typeof w.SEC.runAutoCloudSync === 'function'; }, 20000))) throw new Error(SEC.L('頁面載入失敗', 'Page did not load', 'ទំព័រមិនបានផ្ទុក'));
        if (typeof w.SEC.dataReady === 'function') await w.SEC.dataReady();
        var dbg = function () { return w.SEC.autoSyncDebug ? w.SEC.autoSyncDebug() : { busy:{}, net:{} }; };
        /* 頁面開啟時會自己先同步一次：等它跑完，再跑我們這次（結果以這次為準） */
        await syncSleep(900);
        await syncWaitFor(function () { return done || !dbg().busy[m.id]; }, SYNC_MAX);
        var ok = await w.SEC.runAutoCloudSync(m.id, { tool:m.id, reason:'home-sync', period:'', at:Date.now(), manual:true });
        var net = dbg().net[m.id];
        await syncWaitFor(function () { return done || !dbg().busy[m.id]; }, SYNC_MAX);
        if (ok) finish({ ok:true });
        else if (net && net.ok) finish({ ok:true, msg:SEC.L('雲端已檢查', 'Cloud checked', 'បានពិនិត្យ') + ' ' + SEC.nowStr().slice(-5) });
        else finish({ ok:false, msg:(net && net.code !== 'NETWORK' && net.error) || (navigator.onLine ? SEC.L('雲端沒有回應', 'Cloud did not respond', 'ពពកមិនឆ្លើយតប') : SEC.L('離線', 'Offline', 'គ្មានអ៊ីនធឺណិត')) });
      } catch (e) { finish({ ok:false, msg:String(e && e.message || e) }); }
    };
    f.src = m.u + (m.u.indexOf('?') >= 0 ? '&' : '?') + 'homeSync=1';
    document.body.appendChild(f);
  });
}
async function syncModules(ids) {
  if (SYNC_BUSY || !ids.length) return;
  if (!navigator.onLine) { CLOUD = 'offline'; paintCloud(); SEC.toast(SEC.netFailText(), 'err', 0, { label:SEC.L('🔄 再試一次', '🔄 Try again', '🔄 ព្យាយាមម្តងទៀត'), fn:function () { syncModules(ids); } }); return; }
  SYNC_BUSY = true;
  if (SYNC_FAIL_TOAST && SYNC_FAIL_TOAST.parentNode) SYNC_FAIL_TOAST.parentNode.removeChild(SYNC_FAIL_TOAST); SYNC_FAIL_TOAST = null;
  var list = MODS.filter(function (m) { return ids.indexOf(m.id) >= 0; }), okN = 0, bad = [], prog = document.getElementById('syncProg'), msg = document.getElementById('syncMsg');
  list.forEach(function (m) { SYNC_ST[m.id] = { state:'wait' }; });
  SYNC_RESULT = null; prog.classList.add('on'); prog.firstChild.style.width = '4%'; msg.textContent = ''; CLOUD = 'checking'; paintCloud(); paintSync();
  try {
    for (var i = 0; i < list.length; i++) {
      var m = list[i]; SYNC_ST[m.id] = { state:'run' }; paintSync();
      msg.textContent = '⏳ ' + (i + 1) + '/' + list.length + ' · ' + m.ic + ' ' + (m[SEC.lang()] || m.zh);
      var r = await syncOne(m);
      SYNC_ST[m.id] = { state:r.ok ? 'ok' : 'err', msg:r.msg || '' };
      if (r.ok) okN++; else bad.push(m);
      prog.firstChild.style.width = Math.round((i + 1) / list.length * 100) + '%'; paintSync();
    }
  } finally {
    SYNC_BUSY = false;
    /* 失敗的保留勾選，方便直接按「同步勾選的」重試 */
    if (bad.length) { SYNC_SEL = bad.map(function (m) { return m.id; }); syncSelWrite(SYNC_SEL); }
    CLOUD = okN ? 'ok' : 'offline'; paintCloud();
    var ts = SEC.nowStr(); if (okN) document.getElementById('cTs').textContent = ts;
    SYNC_RESULT = { ok:okN, total:list.length, bad:bad.map(function (m) { return m.id; }) };
    setTimeout(function () { prog.classList.remove('on'); }, 1200);
    paintSync(); renderGrid();
    if (bad.length) SYNC_FAIL_TOAST = SEC.toast('⚠ ' + SEC.L('雲端同步 ' + okN + '/' + list.length + '，' + bad.length + ' 個失敗', 'Cloud sync ' + okN + '/' + list.length + ', ' + bad.length + ' failed', 'សមកាលកម្ម ' + okN + '/' + list.length), 'warn', 0, { label:SEC.L('🔄 重試失敗的', '🔄 Retry failed', '🔄 ព្យាយាមម្តងទៀត'), fn:function () { syncModules(bad.map(function (m) { return m.id; })); } });
    else SEC.toast('✅ ' + SEC.L('已與雲端同步 ' + okN + ' 個模組', 'Synced ' + okN + ' module(s) with the cloud', 'បានធ្វើសមកាលកម្ម ' + okN + ' ម៉ូឌុល'), 'ok', 4000);
  }
}
function openCfg() { SEC.openSettings(); }
window.addEventListener('online', function () { ping(true); });
window.addEventListener('offline', function () { CLOUD = 'offline'; paintCloud(); });

/* 首次載入自動 ping 一次（不擋畫面、不跳提示） */
