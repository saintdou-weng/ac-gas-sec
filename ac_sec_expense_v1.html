<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Security Expense | AC Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<script src="./shared/xlsx.full.min.js?v=20260929a"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="./shared/sec.css?v=20260929a">
<style>
label.req::after{content:' *';color:#dc2626;font-weight:800}
.bad{border-color:#dc2626!important;background:#fff1f2!important}
.edit-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid #f59e0b;background:#fffbeb;color:#92400e;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-weight:700}
.send-why{font-size:12px;color:var(--ink2);align-self:center}
</style>
</head>
<body>
<div id="hdr"></div>

<div class="tabs" id="tabs">
  <button class="tab on" data-p="list" data-zh="📋 費用清單" data-en="📋 Expenses" data-km="📋 ចំណាយ">📋 費用清單</button>
  <button class="tab"    data-p="new"  data-zh="➕ 新增申請" data-en="➕ New"      data-km="➕ ថ្មី">➕ 新增申請</button>
  <button class="tab"    data-p="appr" data-zh="✅ 送出核可" data-en="✅ Approval" data-km="✅ អនុម័ត">✅ 送出核可</button>
  <button class="tab"    data-p="ana"  data-zh="📊 統計分析" data-en="📊 Analytics" data-km="📊 វិភាគ">📊 統計分析</button>
  <button class="tab"    data-p="data" data-zh="💾 資料管理" data-en="💾 Data"      data-km="💾 ទិន្នន័យ">💾 資料管理</button>
</div>

<div class="wrap">
  <div id="pnavHost"></div>

  <!-- ═══ 費用清單 ═══ -->
  <div class="page" id="p-list">
    <div class="grid g4" style="margin-bottom:12px">
      <div class="kpi"><div class="v" id="k1">0</div><div class="l" data-zh="筆數" data-en="Items" data-km="ចំនួន">筆數</div></div>
      <div class="kpi"><div class="v" id="k2">$0</div><div class="l" data-zh="總金額" data-en="Total" data-km="សរុប">總金額</div></div>
      <div class="kpi warn"><div class="v" id="k3">0</div><div class="l" data-zh="待送核可" data-en="Not submitted" data-km="មិនទាន់ស្នើ">待送核可</div></div>
      <div class="kpi ok"><div class="v" id="k4">0</div><div class="l" data-zh="已核可" data-en="Approved" data-km="បានអនុម័ត">已核可</div></div>
    </div>
    <div class="card">
      <h3>📋 <span data-zh="費用清單" data-en="Expense List" data-km="បញ្ជីចំណាយ">費用清單</span>
        <span class="sp">
          <select id="fCat" style="width:auto" onchange="renderList()"><option value="" data-zh="全部分類" data-en="All categories" data-km="គ្រប់ប្រភេទ">全部分類</option></select>
          <input id="q" data-zh="搜尋…" data-en="Search…" data-km="ស្វែងរក…" placeholder="搜尋…" style="width:150px">
          <button class="btn sm gh" onclick="expExcel()">📊 Excel</button>
        </span></h3>
      <div class="tw"><table>
        <thead><tr>
          <th><input type="checkbox" id="chkAll" onchange="toggleAll(this)"></th>
          <th data-zh="編號" data-en="Code" data-km="លេខ">編號</th>
          <th data-zh="日期" data-en="Date" data-km="កាលបរិច្ឆេទ">日期</th>
          <th data-zh="項目" data-en="Item" data-km="ធាតុ">項目</th>
          <th data-zh="分類" data-en="Category" data-km="ប្រភេទ">分類</th>
          <th data-zh="廠商" data-en="Vendor" data-km="អ្នកផ្គត់ផ្គង់">廠商</th>
          <th class="num" data-zh="數量" data-en="Qty" data-km="បរិមាណ">數量</th>
          <th class="num" data-zh="金額" data-en="Amount" data-km="ទឹកប្រាក់">金額</th>
          <th data-zh="狀態" data-en="Status" data-km="ស្ថានភាព">狀態</th>
          <th></th>
        </tr></thead>
        <tbody id="tbList"></tbody>
      </table></div>
    </div>
  </div>

  <!-- ═══ 新增申請 ═══ -->
  <div class="page" id="p-new" style="display:none">
    <div class="card">
      <div id="editBanner" class="edit-banner" style="display:none"><span id="editBannerText"></span>
        <button class="btn sm gray" type="button" onclick="cancelEdit()">✕ <span data-zh="取消編輯" data-en="Cancel edit" data-km="បោះបង់ការកែ">取消編輯</span></button></div>
      <h3>➕ <span id="newTitle" data-zh="新增費用申請" data-en="New Expense" data-km="បន្ថែមចំណាយថ្មី">新增費用申請</span></h3>
      <div class="grid g3">
        <div class="f"><label class="req" data-zh="日期" data-en="Date" data-km="កាលបរិច្ឆេទ">日期</label><input type="date" id="nDate"></div>
        <div class="f"><label class="req" data-zh="項目名稱" data-en="Item" data-km="ធាតុ">項目名稱</label><input id="nName" data-zh="例：制服訂製 / 對講機電池" data-en="e.g. Uniforms / radio batteries" data-km="ឧ. ឯកសណ្ឋាន / ថ្មវិទ្យុទាក់ទង" placeholder="例：制服訂製 / 對講機電池"></div>
        <div class="f"><label data-zh="分類" data-en="Category" data-km="ប្រភេទ">分類</label>
          <select id="nCat"></select></div>
        <div class="f"><label data-zh="廠商" data-en="Vendor" data-km="អ្នកផ្គត់ផ្គង់">廠商</label><input id="nVendor"></div>
        <div class="f"><label data-zh="數量" data-en="Qty" data-km="បរិមាណ">數量</label><input type="number" id="nQty" step="0.01" value="1" oninput="calcAmt()"></div>
        <div class="f"><label data-zh="單位" data-en="Unit" data-km="ឯកតា">單位</label><input id="nUnit" data-zh="件/個/次" data-en="pcs / set / time" data-km="ដុំ / ឈុត / ដង" placeholder="件/個/次"></div>
        <div class="f"><label data-zh="單價 USD" data-en="Unit price USD" data-km="តម្លៃឯកតា USD">單價 USD</label><input type="number" id="nPrice" step="0.01" oninput="calcAmt()"></div>
        <div class="f"><label class="req" data-zh="金額 USD" data-en="Amount USD" data-km="ទឹកប្រាក់ USD">金額 USD</label><input type="number" id="nAmt" step="0.01"><small id="amtHint" class="hint" style="display:none"></small></div>
        <div class="f"><label data-zh="申請人" data-en="Requester" data-km="អ្នកស្នើ">申請人</label><input id="nBy"></div>
      </div>
      <div class="f" style="margin-top:9px"><label data-zh="用途 / 原因" data-en="Reason" data-km="មូលហេតុ">用途 / 原因</label><textarea id="nReason" rows="2"></textarea></div>
      <div class="f" style="margin-top:9px"><label data-zh="單據照片" data-en="Receipt Photo" data-km="រូបភាពបង្កាន់ដៃ">單據照片</label>
        <div class="photo-drop" onclick="addPhoto()">📷 <span data-zh="點此拍照或選擇單據圖片" data-en="Tap to add receipt photo" data-km="ចុចដើម្បីថតរូបបង្កាន់ដៃ">點此拍照或選擇單據圖片</span></div>
        <div id="nPhotos"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnSave" onclick="saveNew()">💾 <span data-zh="儲存" data-en="Save" data-km="រក្សាទុក">儲存</span></button>
        <button class="btn gh" id="btnSaveSubmit" onclick="saveNew(true)">💾✅ <span data-zh="儲存並前往送核可" data-en="Save & go to approval" data-km="រក្សាទុក ហើយទៅស្នើអនុម័ត">儲存並前往送核可</span></button>
        <button class="btn gray" type="button" onclick="cancelEdit()">✕ <span data-zh="清空表單" data-en="Clear form" data-km="សម្អាតទម្រង់">清空表單</span></button>
      </div>
    </div>
  </div>

  <!-- ═══ 送出核可 ═══ -->
  <div class="page" id="p-appr" style="display:none">
    <div class="card">
      <h3>✅ <span data-zh="送出核可" data-en="Send for Approval" data-km="ស្នើសុំអនុម័ត">送出核可</span></h3>
      <p class="hint" style="margin-bottom:11px" id="apprHint"></p>
      <div class="f"><label data-t="route">核可路徑</label></div>
      <div id="routePick"></div>
      <div class="sep"></div>
      <div class="grid g3">
        <div class="f"><label data-zh="批次標題" data-en="Batch Title" data-km="ចំណងជើងបាច់">批次標題</label><input id="aTitle"></div>
        <div class="f"><label data-zh="期間" data-en="Period" data-km="រយៈពេល">期間</label><input id="aPeriod"></div>
        <div class="f"><label data-zh="送出範圍" data-en="Scope" data-km="វិសាលភាព">送出範圍</label>
          <select id="aScope" onchange="renderAppr()">
            <option value="period" data-zh="本期間未送核可的全部" data-en="All unsent items in this period" data-km="ធាតុមិនទាន់ស្នើទាំងអស់ក្នុងរយៈពេលនេះ">本期間未送核可的全部</option>
            <option value="checked" data-zh="清單中勾選的項目" data-en="Items checked in the list" data-km="ធាតុដែលបានធីកក្នុងបញ្ជី">清單中勾選的項目</option>
          </select></div>
      </div>
      <div class="sep"></div>
      <div id="apprPreview"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ok" id="btnSend" onclick="doSend()">📤 <span data-zh="送出核可請求" data-en="Send Approval Request" data-km="ផ្ញើសំណើអនុម័ត">送出核可請求</span></button>
        <span class="send-why" id="sendWhy"></span>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn gh" onclick="openExpenseTelegram()">✈️ <span data-zh="Telegram 摘要／保安費核可" data-en="Telegram summary / fee approval" data-km="សង្ខេប Telegram / អនុម័តថ្លៃសេវា">Telegram 摘要／保安費核可</span></button>
        <button class="btn gh" id="btnStatus" onclick="checkStatus()">🔍 <span data-zh="查詢批次狀態" data-en="Check Status" data-km="ពិនិត្យស្ថានភាព">查詢批次狀態</span></button>
        <button class="btn gh" id="btnSyncBatch" onclick="syncBatches()">☁️ <span data-zh="從雲端找回舊批次" data-en="Find cloud batches" data-km="ស្វែងរកបាច់លើពពក">從雲端找回舊批次</span></button>
      </div>
    </div>
    <div class="card">
      <h3>📜 <span data-zh="送出記錄" data-en="Submission Log" data-km="កំណត់ត្រាការផ្ញើ">送出記錄</span></h3>
      <div class="tw"><table><thead><tr>
        <th data-zh="批次" data-en="Batch" data-km="បាច់">批次</th>
        <th data-zh="時間" data-en="Time" data-km="ម៉ោង">時間</th>
        <th data-zh="路徑" data-en="Route" data-km="ផ្លូវ">路徑</th>
        <th class="num" data-zh="筆數" data-en="Items" data-km="ចំនួន">筆數</th>
        <th class="num" data-zh="金額" data-en="Amount" data-km="ទឹកប្រាក់">金額</th>
        <th data-zh="狀態" data-en="Status" data-km="ស្ថានភាព">狀態</th></tr></thead>
        <tbody id="tbBatch"></tbody></table></div>
    </div>
  </div>

  <!-- ═══ 統計 ═══ -->
  <div class="page" id="p-ana" style="display:none">
    <div class="card"><h3>📈 <span data-zh="費用趨勢" data-en="Expense Trend" data-km="និន្នាការចំណាយ">費用趨勢</span></h3>
      <div style="height:250px"><canvas id="ch1"></canvas></div></div>
    <div class="grid g2">
      <div class="card"><h3>🏷 <span data-zh="分類佔比" data-en="By Category" data-km="តាមប្រភេទ">分類佔比</span></h3>
        <div style="height:250px"><canvas id="ch2"></canvas></div></div>
      <div class="card"><h3>🏪 <span data-zh="廠商金額" data-en="By Vendor" data-km="តាមអ្នកផ្គត់ផ្គង់">廠商金額</span></h3>
        <div style="height:250px"><canvas id="ch3"></canvas></div></div>
    </div>
    <div class="card">
      <h3>💵 <span data-zh="預算控管" data-en="Budget Control" data-km="ការគ្រប់គ្រងថវិកា">預算控管</span>
        <span class="sp"><label style="font-size:11px;color:var(--ink2)" data-zh="本期預算 USD" data-en="Budget this period (USD)" data-km="ថវិការយៈពេលនេះ (USD)">本期預算 USD</label>
        <input type="number" id="budget" style="width:110px" oninput="renderBudget()"></span></h3>
      <div id="budgetBox" class="hint"></div>
    </div>
  </div>

  <!-- ═══ 資料管理 ═══ -->
  <div class="page" id="p-data" style="display:none">
    <div class="card">
      <h3>💾 <span data-zh="資料工具" data-en="Data Tools" data-km="ឧបករណ៍ទិន្នន័យ">資料工具</span></h3>
      <div class="row">
        <button class="btn" onclick="impFee()">🛡 <span data-zh="匯入保安服務費申請表" data-en="Import Security Service Fee" data-km="នាំចូលថ្លៃសេវាសន្តិសុខ">匯入保安服務費申請表</span></button>
        <button class="btn gh" onclick="impExcel()">📥 <span data-t="impExcel">匯入一般 Excel</span></button>
        <button class="btn gh" onclick="expExcel()">📊 <span data-t="expExcel">匯出 Excel</span></button>
        <button class="btn gh" onclick="SEC.backupJson({records:DB,batches:BATCH},'expense_backup_'+SEC.ymd()+'.json')">💾 <span data-t="backup">備份 JSON</span></button>
        <button class="btn gh" onclick="restore()">📂 <span data-t="restore">還原 JSON</span></button>
        <button class="btn err" onclick="clearAll()">🗑 <span data-zh="清空" data-en="Clear" data-km="សម្អាត">清空</span></button>
      </div>
      <div class="sep"></div>
      <p class="hint" data-zh="可辨識欄位：日期、項目、分類、廠商、數量、單價、金額、原因、備註（中文、英文或高棉文標題皆可）。" data-en="Recognised columns: Date, Item/Description, Category, Vendor/Supplier, Qty, Price, Amount/Total, Reason/Purpose, Remark (Chinese, English or Khmer headers)." data-km="ជួរឈរដែលស្គាល់៖ កាលបរិច្ឆេទ ធាតុ ប្រភេទ អ្នកផ្គត់ផ្គង់ បរិមាណ តម្លៃ ទឹកប្រាក់ មូលហេតុ កំណត់ចំណាំ (ចំណងជើងចិន អង់គ្លេស ឬខ្មែរ)។">可辨識欄位：日期、項目、分類、廠商、數量、單價、金額、原因、備註（中文、英文或高棉文標題皆可）。</p>
      <div id="impLog" class="hint" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <h3>☁ <span data-zh="雲端同步" data-en="Cloud Sync" data-km="សមកាលកម្មពពក">雲端同步</span></h3>
      <div class="row">
        <button class="btn" onclick="doUpload()">⬆️☁ <span data-t="upload">上傳雲端</span></button>
        <button class="btn gh" onclick="doDownload()">⬇️☁ <span data-t="download">下載雲端</span></button>
      </div>
    </div>
  </div>
</div>

<div id="toastwrap"></div>
<script src="./shared/sec-core.js?v=20260929a"></script>
<script src="./shared/sec-smart-sync.js?v=20260929a"></script>
<script>
/* ═══ 相依防護：shared/sec-core.js 未載入時給明確提示，不讓整頁死掉 ═══ */
if (typeof SEC === 'undefined') {
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.createElement('div');
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#991b1b;color:#fff;'
      + 'padding:12px 16px;font:600 13px/1.5 system-ui,sans-serif;text-align:center';
    b.innerHTML = '⚠ shared/sec-core.js could not be loaded / 共用元件未能載入。<br>'
      + 'Upload the <b>shared</b> folder to GitHub and open the page by its https:// address.';
    document.body.insertBefore(b, document.body.firstChild);
  });
  throw new Error('sec-core.js not loaded');
}

var LS = 'ac_sec_expense_db', LSB = 'ac_sec_expense_batches';
var DB = [], BATCH = [], PH = [], PER = new SEC.Period('month'), CH = {}, TOOL = 'expense', EXP_EDIT_ID = '';
var BUSY = {}, OPENING_EDIT = false, AUTO_TITLE = '';

/* ═══ 三語 ═══ */
function L(zh, en, km) { return SEC.L(zh, en, km); }
/* Telegram：依摘要視窗選的語言輸出單一語言（km 缺值退回英文）。 */
function tl(lang, zh, en, km) { return lang === 'en' ? en : lang === 'km' ? (km || en) : zh; }
var CATS = [
  ['制服 Uniform',                 '制服',       'Uniform',              'ឯកសណ្ឋាន'],
  ['裝備 Equipment',               '裝備',       'Equipment',            'ឧបករណ៍'],
  ['維修 Repair',                  '維修',       'Repair',               'ជួសជុល'],
  ['耗材 Consumable',              '耗材',       'Consumable',           'សម្ភារៈប្រើប្រាស់'],
  ['加班 Overtime',                '加班',       'Overtime',             'ថែមម៉ោង'],
  ['訓練 Training',                '訓練',       'Training',             'បណ្តុះបណ្តាល'],
  ['交通 Transport',               '交通',       'Transport',            'ដឹកជញ្ជូន'],
  ['保安服務費 Security Service',  '保安服務費', 'Security service fee', 'ថ្លៃសេវាសន្តិសុខ'],
  ['其他 Others',                  '其他',       'Others',               'ផ្សេងៗ'],
];
function catLabel(v, lang) {
  var s = String(v == null ? '' : v);
  for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === s) return lang ? tl(lang, CATS[i][1], CATS[i][2], CATS[i][3]) : L(CATS[i][1], CATS[i][2], CATS[i][3]);
  return trData(s, lang);
}
/* 舊資料中由程式產生的中文字（例如「保安服務費 」「日班 Day」「人月」）只在顯示時翻譯；儲存值不變，避免匯入去重鍵改變。 */
function trData(s, lang) {
  s = String(s == null ? '' : s);
  var t = function (zh, en, km) { return lang ? tl(lang, zh, en, km) : L(zh, en, km); };
  return s.replace(/保安服務費 Security Service/g, t('保安服務費', 'Security service fee', 'ថ្លៃសេវាសន្តិសុខ'))
    .replace(/^保安服務費\s*/, t('保安服務費 ', 'Security fee · ', 'ថ្លៃសេវាសន្តិសុខ · '))
    .replace(/日班 Day/g, t('日班', 'Day shift', 'វេនថ្ងៃ')).replace(/夜班 Night/g, t('夜班', 'Night shift', 'វេនយប់'))
    .replace(/^人月$/, t('人月', 'person-month', 'នាក់/ខែ')).replace(/^\(未命名\)$/, t('（未命名）', '(unnamed)', '(គ្មានឈ្មោះ)'));
}
function statusText(r, lang) {
  var t = function (zh, en, km) { return lang ? tl(lang, zh, en, km) : L(zh, en, km); };
  if (!isSecurityFee(r)) return t('免核／一般費用', 'No approval needed', 'មិនត្រូវការអនុម័ត');
  if (r.apprStatus === 'approved') return t('已核可', 'Approved', 'បានអនុម័ត');
  if (r.apprStatus === 'rejected') return t('退件（可重送）', 'Rejected (can resend)', 'បានបដិសេធ (អាចផ្ញើម្តងទៀត)');
  if (r.batchId) return t('待核', 'Pending', 'រង់ចាំ');
  return t('未送核', 'Not submitted', 'មិនទាន់ស្នើ');
}

      var icon = !isSecurityFee(r) ? '⚪ ' : r.apprStatus === 'approved' ? '✅ ' : r.apprStatus === 'rejected' ? '✕ ' : r.batchId ? '⏳ ' : '';

      '</tr>';
    }).join('');
}

function calcAmt() {
  var qs = document.getElementById('nQty').value, ps = document.getElementById('nPrice').value;
  var q = Number(qs) || 0, p = Number(ps) || 0, amt = document.getElementById('nAmt'), hint = document.getElementById('amtHint');
  var both = qs !== '' && ps !== '' && q > 0 && p > 0;
  if (both) { amt.value = (Math.round(q * p * 100) / 100).toFixed(2); amt.classList.remove('bad'); }
  amt.readOnly = both;
  hint.style.display = both ? '' : 'none';
  hint.textContent = both ? L('＝ 數量 × 單價（自動計算）', '= Qty × Unit price (automatic)', '= បរិមាណ × តម្លៃ (គណនាស្វ័យប្រវត្តិ)') : '';
}

function addPhotoRefresh() {
  document.getElementById('nPhotos').innerHTML = SEC.photoListHtml(PH, true);
  document.getElementById('nPhotos').querySelectorAll('.del').forEach(function (b) {
    b.onclick = function () { PH.splice(+b.dataset.i, 1); addPhotoRefresh(); };
  });

/* 同一前綴＋同一天：取現存（含已刪除墓碑）最大序號 + 1，不用 DB.length。 */
function nextCode(prefix, day) {
  var pre = prefix + '-' + day + '-', max = 0, seen = live().slice();
  try { if (SEC.getDeleted) seen = seen.concat(SEC.getDeleted(TOOL) || []); } catch (e) {}
  seen.forEach(function (r) {
    var c = String(r && r.code || '');
    if (c.indexOf(pre) !== 0) return;
    var n = parseInt(c.slice(pre.length), 10);
    if (n > max) max = n;
  });
  return pre + String(max + 1).padStart(3, '0');
}
function paintEditBanner() {
  var box = document.getElementById('editBanner'), old = EXP_EDIT_ID ? DB.filter(function (x) { return x.id === EXP_EDIT_ID; })[0] : null;
  if (!box) return;
  box.style.display = old ? '' : 'none';
  document.getElementById('editBannerText').textContent = old ? '✏️ ' + L('編輯中：', 'Editing: ', 'កំពុងកែ៖ ') + (old.code || old.id) : '';
  document.getElementById('newTitle').textContent = old ? L('修改費用申請', 'Edit Expense', 'កែចំណាយ') : L('新增費用申請', 'New Expense', 'បន្ថែមចំណាយថ្មី');
}

  EXP_EDIT_ID = '';
  ['nName','nVendor','nUnit','nPrice','nAmt','nReason','nBy'].forEach(function (i) { var el = document.getElementById(i); el.value = ''; el.classList.remove('bad'); });
  document.getElementById('nDate').value = SEC.ymd(); document.getElementById('nDate').classList.remove('bad');
  document.getElementById('nQty').value = 1;

function cancelEdit() { resetForm(); }
function saveNew(submit) {
  if (BUSY.save) return; BUSY.save = true;
  try {
    var old = EXP_EDIT_ID ? DB.filter(function (x) { return x.id === EXP_EDIT_ID; })[0] : null;
    if (EXP_EDIT_ID && !old) { EXP_EDIT_ID = ''; paintEditBanner(); }
    calcAmt();
    var date = document.getElementById('nDate').value;
    var r = {
      id    : old ? old.id : 'E' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      code  : old && old.code ? old.code : nextCode('EXP', String(date || SEC.ymd()).replace(/-/g, '')),
      date  : date,
      name  : document.getElementById('nName').value.trim(),
      cat   : document.getElementById('nCat').value,
      vendor: document.getElementById('nVendor').value.trim(),
      qty   : Number(document.getElementById('nQty').value) || 0,
      unit  : document.getElementById('nUnit').value.trim(),
      price : Number(document.getElementById('nPrice').value) || 0,
      amount: Number(document.getElementById('nAmt').value) || 0,
      by    : document.getElementById('nBy').value.trim() || SEC.getCfg().operator,
      reason: document.getElementById('nReason').value.trim(),
      photos: PH.slice(),
      batchId: old ? old.batchId || '' : '', apprStatus: old ? old.apprStatus || '' : '',
      createdAt: old ? old.createdAt || SEC.nowStr() : SEC.nowStr(), updatedAt: new Date().toISOString(),
    };
    if (r.qty && r.price) r.amount = Math.round(r.qty * r.price * 100) / 100;
    var missing = [];
    if (!r.date) missing.push('nDate');
    if (!r.name) missing.push('nName');
    if (!r.amount) missing.push('nAmt');
    if (missing.length) {
      missing.forEach(function (id) { document.getElementById(id).classList.add('bad'); });
      document.getElementById(missing[0]).focus();
      SEC.toast('⚠ ' + L('請填寫紅框必填欄位（日期、項目名稱、金額）', 'Fill in the required fields in red (date, item, amount)', 'សូមបំពេញវាលចាំបាច់ពណ៌ក្រហម (កាលបរិច្ឆេទ ធាតុ ទឹកប្រាក់)'), 'warn');
      return;
    }
    /* #20：已核可／待核的項目，業務欄位有改動 → 撤銷原核可，需重新送核。 */
    if (old && (old.batchId || old.apprStatus) && old.apprStatus !== 'rejected' && businessChanged(old, r)) {
      if (!confirm(L('已核可或待核的項目修改後需重新核可。\n儲存後此筆會變回「未送核」。繼續？',
        'Approved or pending items must be re-approved after editing.\nThis record will return to “Not submitted”. Continue?',
        'ធាតុដែលបានអនុម័ត ឬកំពុងរង់ចាំ ត្រូវអនុម័តម្តងទៀតក្រោយកែ។\nកំណត់ត្រានេះនឹងត្រឡប់ទៅ “មិនទាន់ស្នើ”។ បន្តទេ?'))) return;
      r.batchId = ''; r.apprStatus = '';
    }
    if (!old) {
      var dup = live().filter(function (x) { return x.date === r.date && x.name === r.name && x.vendor === r.vendor && Number(x.amount) === Number(r.amount); })[0];
      if (dup && !confirm(L('發現同日、同項目、同廠商及同金額的紀錄（' + (dup.code || dup.id) + '）。仍要另外新增一筆嗎？',
        'A record with the same date, item, vendor and amount exists (' + (dup.code || dup.id) + '). Add another one anyway?',
        'មានកំណត់ត្រាដូចគ្នា (' + (dup.code || dup.id) + ')។ នៅតែបន្ថែមថ្មីទេ?'))) return;
      DB.push(r);
    } else Object.assign(old, r);
    save(); SEC.scheduleAutoCloudSync(TOOL, isSecurityFee(r) ? 'expense-security-fee-save' : 'expense-save', r.date);
    SEC.toast('✅ ' + L('已儲存 ', 'Saved ', 'បានរក្សាទុក ') + r.code, 'ok');
    resetForm(); renderAll();
    if (submit) { document.querySelector('.tab[data-p="appr"]').click(); }
  } finally { BUSY.save = false; }
}
function businessChanged(a, b) {
  return ['date','name','cat','vendor','qty','unit','price','amount','reason','by'].some(function (k) {
    return String(a[k] == null ? '' : a[k]) !== String(b[k] == null ? '' : b[k]);
  });
}
function editExpense(id){
  var r = DB.filter(function (x) { return x.id === id; })[0]; if (!r) return;
  resetForm();
  EXP_EDIT_ID = id;
  [['nDate',r.date],['nName',r.name],['nCat',r.cat],['nVendor',r.vendor],['nQty',r.qty],['nUnit',r.unit],['nPrice',r.price],['nAmt',r.amount],['nBy',r.by],['nReason',r.reason]].forEach(function (x) {
    var el = document.getElementById(x[0]); if (el) el.value = x[1] == null ? '' : x[1];
  });
  var cat = document.getElementById('nCat');
  if (r.cat && cat.value !== r.cat) { cat.insertAdjacentHTML('beforeend', '<option value="' + SEC.esc(r.cat) + '">' + SEC.esc(catLabel(r.cat)) + '</option>'); cat.value = r.cat; }
  PH = Array.isArray(r.photos) ? r.photos.slice() : []; addPhotoRefresh(); calcAmt();
  OPENING_EDIT = true;
  try { var tab = document.querySelector('.tab[data-p="new"]'); if (tab) tab.click(); } finally { OPENING_EDIT = false; }
  paintEditBanner();
  if (r.apprStatus === 'approved' || (r.batchId && r.apprStatus !== 'rejected'))
    SEC.toast('⚠ ' + L('此筆已送核可；修改金額或內容後需重新核可。', 'This item was sent for approval; changing it requires re-approval.', 'ធាតុនេះបានស្នើអនុម័តរួច; ការកែនឹងត្រូវអនុម័តម្តងទៀត។'), 'warn', 5000);
}
function delRec(id) {
  var old = DB.filter(function (r) { return r.id === id; })[0]; if (!old) return;
  if (!confirm(L('刪除 ', 'Delete ', 'លុប ') + (old.code || id) + ' · ' + trData(old.name) + '？\n' + SEC.T().confirmDel)) return;
  SEC.markDeleted(TOOL, old);
  if (EXP_EDIT_ID === id) resetForm();
  DB = DB.filter(function (r) { return r.id !== id; });
  save(); renderAll(); SEC.scheduleAutoCloudSync(TOOL, 'expense-delete', old.date || '');
}

/* ═══ 核可 ═══ */
function isSecurityFee(r) {
  var s = String((r && r.cat) || '') + ' ' + String((r && r.name) || '');
  return /security\s*(service\s*)?fee|保安服務費|保安費|security service/i.test(s);
}
function targets() {
  if (document.getElementById('aScope').value === 'checked') {
    var ids = checkedIds();
    return live().filter(function (r) { return ids.indexOf(r.id) >= 0 && sendable(r); });
  }
  return inPeriod().filter(sendable);
}
/* 核可合約：key = 紀錄 id（穩定唯一），id = 顯示編號。 */
function approvalItem(x) {
  var ph = Array.isArray(x.photos) ? x.photos.slice(0, 4) : [];
  return { _recordId: x.id, key: x.id, id: x.code || x.id, name: x.name, dept: x.cat, vendor: x.vendor,
    qty: x.qty, unit: x.unit, amount: x.amount, date: x.date, period: String(x.date || '').slice(0, 7),
    reason: x.reason, info: (x.by ? 'Requester: ' + x.by : '') + (x.price ? (x.by ? ' · ' : '') + 'Unit price $' + Number(x.price).toFixed(2) : ''),
    batchId: x.apprStatus === 'rejected' ? '' : (x.batchId || ''), photo: ph[0] || '', photos: ph };
}

function markSent(list, result, route) {
  var bid = result && result.batchId || '';
  if (!bid) return;
  var ids = list.map(function (x) { return x._recordId || x.id; });
  var skipped = (result.skippedKeys || result.skippedItems || []).map(function (k) { return String(k && (k.key || k.itemId) || k); });
  DB.forEach(function (x) {
    if (ids.indexOf(x.id) < 0) return;
    if (skipped.indexOf(x.id) >= 0) { x.apprStatus = 'approved'; return; }  /* 後端判定內容相同且已核可 */
    x.batchId = bid; x.apprStatus = 'pending'; x.updatedAt = new Date().toISOString();
  });
  var amt = list.reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
  var b = BATCH.filter(function (x) { return x.batchId === bid; })[0];
  if (b) { b.status = 'open'; b.n = list.length; b.amount = amt; }
  else BATCH.unshift({ batchId: bid, at: SEC.nowStr(), route: result.route || route || 'review', n: list.length, amount: amt, status: 'open' });
}
async function doSend() {
  if (BUSY.send) return;
  var list = targets();
  if (!list.length) { SEC.toast('⚠ ' + L('沒有可送核可的項目', 'Nothing to send for approval', 'គ្មានធាតុសម្រាប់ស្នើអនុម័ត'), 'warn'); return; }
  BUSY.send = true; renderAppr();
  try {
    var route = SEC.pickedRoute('rp');
    var items = list.map(approvalItem);
    var r = await SEC.sendApproval({
      module: 'expense',
      period: document.getElementById('aPeriod').value || PER.key(),
      title : document.getElementById('aTitle').value,
      route : route,
      items : items,
    });
    if (!r || !r.batchId) return;
    if (r.closed) { SEC.toast('⚠ ' + L('後端回傳已關閉的舊批次，未重新送出；請更新 ac_sec.gs 後重試。', 'The server returned a closed batch and nothing was sent; update ac_sec.gs and retry.', 'ម៉ាស៊ីនមេបានត្រឡប់បាច់ដែលបានបិទ; សូមធ្វើបច្ចុប្បន្នភាព ac_sec.gs ។'), 'warn', 7000); return; }
    markSent(items, r, route);
    save(); SEC.scheduleAutoCloudSync(TOOL, 'expense-approval-sent', PER.key());
  } finally { BUSY.send = false; renderAll(); }
}
/* 狀態只依紀錄 id 對應；舊批次（當時用編號當 key）只套用到「目前仍屬於該批次」的紀錄。 */
function applyBatchStatus(b, r) {
  var n = 0;
  (r.items || []).forEach(function (it) {
    var key = String(it.key || it.itemId || '');
    if (!key || !it.status) return;
    DB.forEach(function (x) {
      if (x.batchId !== b.batchId) return;
      if (x.id === key || x._recordId === key || (x.code === key && !DB.some(function (y) { return y.id === key; }))) {
        var st = it.status === 'waived' ? 'approved' : it.status;
        if (x.apprStatus !== st) { x.apprStatus = st; x.updatedAt = new Date().toISOString(); n++; }
      }
    });
  });
  return n;
}
async function checkStatus() {
  if (BUSY.status) return;
  if (!BATCH.length) { SEC.toast(L('尚無送出記錄', 'No submissions yet', 'មិនទាន់មានការផ្ញើ'), 'warn'); return; }
  BUSY.status = true; var btn = document.getElementById('btnStatus'); if (btn) btn.disabled = true;
  SEC.toast('<span class="spin">⏳</span> ' + L('查詢中…', 'Checking…', 'កំពុងពិនិត្យ…'));
  var changed = 0, failed = 0, done = 0;
  try {
    for (var i = 0; i < BATCH.length && done < 8; i++) {
      var b = BATCH[i];
      if (b.status === 'closed' && b.synced) continue;
      done++;
      try {
        var r = await SEC.gasPost({ action: 'approvalStatus', batchId: b.batchId });
        b.status = r.status; b.counts = r.counts; b.stage = r.stage;
        changed += applyBatchStatus(b, r);
        if (r.status === 'closed') b.synced = true;
      } catch (e) { failed++; }
    }
    save(); renderAll();
    SEC.toast((failed ? '⚠ ' : '✅ ') + L('狀態已更新', 'Status updated', 'បានធ្វើបច្ចុប្បន្នភាពស្ថានភាព') + (changed ? ' · ' + changed : '') + (failed ? ' · ' + L('失敗 ', 'failed ', 'បរាជ័យ ') + failed : ''), failed ? 'warn' : 'ok');
    if (changed) SEC.scheduleAutoCloudSync(TOOL, 'expense-approval-status', PER.key());
  } finally { BUSY.status = false; if (btn) btn.disabled = false; }
}
async function syncBatches() {
  if (BUSY.sync) return; BUSY.sync = true;
  var btn = document.getElementById('btnSyncBatch'); if (btn) btn.disabled = true;
  SEC.toast('<span class="spin">⏳</span> ' + L('從雲端找回批次…', 'Finding cloud batches…', 'កំពុងស្វែងរកបាច់លើពពក…'));
  try {
    var remote = await SEC.gasPost({ action:'approvalList', module:'expense' });
    (Array.isArray(remote) ? remote : []).forEach(function (r) {
      var b = BATCH.filter(function (x) { return x.batchId === r.batchId; })[0];
      if (!b) { b = { batchId:r.batchId }; BATCH.push(b); }
      Object.keys(r).forEach(function (k) { b[k] = r[k]; });
      b.at = b.at || r.at || r.updatedAt || '';
    });
    BATCH.sort(function (a, b) { return String(b.at || '').localeCompare(String(a.at || '')); });
    save(); renderAll();
    SEC.toast('✅ ' + L('已找回 ', 'Found ', 'បានរកឃើញ ') + (Array.isArray(remote) ? remote.length : 0) + L(' 個雲端批次；未關閉批次可按「重送／更新」', ' cloud batches; open batches can be resent / refreshed', ' បាច់; បាច់មិនទាន់បិទអាចផ្ញើម្តងទៀត'), 'ok', 6000);
  } catch (e) { SEC.toast('❌ ' + L('找回批次失敗：', 'Could not load batches: ', 'មិនអាចទាញបាច់៖ ') + e.message, 'err', 6000); }
  finally { BUSY.sync = false; if (btn) btn.disabled = false; }
}
async function resendBatch(batchId) {
  if (!batchId || BUSY['resend' + batchId]) return;
  if (!confirm(L('重新整理或重送此 Telegram 核可訊息？不會新增費用項目。', 'Refresh or resend this Telegram approval message? No expense items will be added.', 'ធ្វើបច្ចុប្បន្នភាព ឬផ្ញើសារអនុម័តនេះម្តងទៀត? មិនបន្ថែមចំណាយទេ។'))) return;
  BUSY['resend' + batchId] = true;
  try {
    var r = await SEC.gasPost({ action:'approvalResend', batchId:batchId });
    var b = BATCH.filter(function (x) { return x.batchId === batchId; })[0] || { batchId:batchId };
    Object.keys(r || {}).forEach(function (k) { b[k] = r[k]; });
    if (!BATCH.some(function (x) { return x.batchId === batchId; })) BATCH.unshift(b);
    save(); renderAll();
    SEC.toast(r && r.refreshed ? '✅ ' + L('Telegram 舊訊息已更新，按鈕已恢復', 'Telegram message refreshed; buttons restored', 'បានធ្វើបច្ចុប្បន្នភាពសារ Telegram') : '✅ ' + L('Telegram 核可訊息已重送', 'Telegram approval message resent', 'បានផ្ញើសារអនុម័តម្តងទៀត'), 'ok', 6000);
  } catch (e) { SEC.toast('❌ ' + L('重送失敗：', 'Resend failed: ', 'ផ្ញើម្តងទៀតបរាជ័យ៖ ') + e.message, 'err', 7000); }
  finally { BUSY['resend' + batchId] = false; }
}
function renderBatch() {
  var tb = document.getElementById('tbBatch');
  if (!BATCH.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">' + SEC.esc(L('尚無送出記錄', 'No submissions yet', 'មិនទាន់មានការផ្ញើ')) + '</td></tr>'; return; }
  tb.innerHTML = BATCH.map(function (b) {
    var c = b.counts || {};
    var st = b.status === 'closed' ? '<span class="tag gray">🔒 ' + SEC.esc(L('已關閉', 'Closed', 'បានបិទ')) + '</span>'
           : b.stage === 'review' ? '<span class="tag info">🔍 ' + SEC.esc(L('待審查', 'Awaiting review', 'រង់ចាំត្រួតពិនិត្យ')) + '</span>'
           : '<span class="tag warn">⏳ ' + SEC.esc(L('待核可', 'Awaiting approval', 'រង់ចាំអនុម័ត')) + '</span>';

    var act = b.status === 'closed' ? '' : '<button class="btn sm gh" onclick="resendBatch(\'' + SEC.esc(b.batchId) + '\')">🔄 ' + SEC.esc(L('重送／更新', 'Resend / refresh', 'ផ្ញើម្តងទៀត')) + '</button>';
    return '<tr><td><code>' + SEC.esc(b.batchId) + '</code></td><td>' + SEC.esc(b.at) + '</td>' +
      '<td>' + (b.route === 'direct' ? '🚀 ' + SEC.esc(L('直送', 'Direct', 'ផ្ទាល់')) : '👥 ' + SEC.esc(L('群組審查', 'Group review', 'ត្រួតពិនិត្យជាក្រុម'))) + '</td>' +
      '<td class="num">' + (b.n || 0) + '</td><td class="num">' + money(b.amount) + '</td><td>' + st + (act ? '<br>' + act : '') + '</td></tr>';
  }).join('');

function chart(id, type, labels, ds) {
  var el = document.getElementById(id); if (!el) return;
  if (typeof Chart === 'undefined') { el.parentNode.innerHTML = '<div class="empty" style="padding:30px">📊 ' + SEC.esc(L('圖表元件未載入，表格功能仍可使用；請重新整理後再試。', 'Chart component not loaded; tables still work. Refresh and try again.', 'មិនអាចផ្ទុកក្រាហ្វ; តារាងនៅតែប្រើបាន។ សូមផ្ទុកឡើងវិញ។')) + '</div>'; return; }
  if (CH[id]) CH[id].destroy();
  CH[id] = new Chart(el, { type: type, data: { labels: labels, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: type === 'doughnut', position: 'bottom', labels: { font: { size: 10 } } } },
      scales: type === 'doughnut' ? {} : { y: { beginAtZero: true } } } });
}
function renderBudget() {
  var bud = Number(document.getElementById('budget').value) || 0;
  var amt = inPeriod().reduce(function (s, r) { return s + (Number(r.amount) || 0); }, 0);
  var box = document.getElementById('budgetBox');
  if (!bud) { box.textContent = L('填入預算後顯示執行率。', 'Enter a budget to show the spending rate.', 'បញ្ចូលថវិកាដើម្បីបង្ហាញអត្រាចំណាយ។'); return; }

    money(amt) + ' / ' + money(bud) + ' (' + pct + '%)</b>' +
    (pct > 100 ? '<span class="tag err">⚠️ ' + SEC.esc(L('超預算 ', 'Over budget ', 'លើសថវិកា ')) + money(amt - bud) + '</span>' : '<span class="tag ok">✅ ' + SEC.esc(L('預算內', 'Within budget', 'ក្នុងថវិកា')) + '</span>') +
    '</div><div class="bar" style="margin-top:8px"><i style="width:' + Math.min(100, pct) + '%;' +
    (pct > 100 ? 'background:linear-gradient(90deg,#dc2626,#f87171)' : '') + '"></i></div>';

var SPEC = {
  date  : ['日期','date','កាលបរិច្ឆេទ','កាល','ថ្ងៃ','日子','購買日期','trans date'],
  name  : ['項目','item','ធាតុ','品名','description','desc','名稱','name','內容','particulars','details'],
  cat   : ['分類','category','ប្រភេទ','類別','type','種類','group'],
  vendor: ['廠商','vendor','supplier','អ្នកផ្គត់ផ្គង់','供應商','店家','shop','company'],
  qty   : ['數量','qty','quantity','បរិមាណ','pcs','件數'],
  unit  : ['單位','unit','ឯកតា'],
  price : ['單價','price','unitprice','តម្លៃ','rate'],
  amount: ['金額','amount','total','ទឹកប្រាក់','費用','cost','價格','usd','小計','sum'],
  reason: ['原因','reason','用途','purpose','មូលហេតុ','remark','備註','note','說明'],
};
function impExcel() {
  SEC.pickExcel(function (sheets) {
    var added = 0, updated = 0, skipped = 0, log = [], importedDates = {};
    sheets.forEach(function (sh) {
      var res = SEC.parseSheet(sh.rows, SPEC, { minScore: 2 });
      if (!res.rows.length) { log.push('· <b>' + SEC.esc(sh.name) + '</b>: ' + SEC.esc(L('未偵測到資料（分數 ', 'no data detected (score ', 'រកមិនឃើញទិន្នន័យ (ពិន្ទុ ')) + res.header.score + ')'); return; }
      var n = 0;
      res.rows.forEach(function (o) {
        var name = SEC.str(o.name);
        var amount = SEC.num(o.amount) || (SEC.num(o.qty) * SEC.num(o.price));
        if (!name && !amount) return;
        var d = SEC.parseD(o.date), date = d ? SEC.ymd(d) : SEC.ymd();
        var row = {
          id: 'X' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          code: '',
          date: date,
          name: name || '(未命名)', cat: SEC.str(o.cat) || sh.name,
          vendor: SEC.str(o.vendor), qty: SEC.num(o.qty), unit: SEC.str(o.unit),
          price: SEC.num(o.price), amount: amount,
          reason: SEC.str(o.reason), photos: [], batchId: '', apprStatus: '',
          src: sh.name, createdAt: SEC.nowStr(),
        };
        var old = live().filter(function (x) { return x.date === row.date && x.name === row.name && x.vendor === row.vendor && Number(x.amount) === Number(row.amount); })[0];
        row.updatedAt = new Date().toISOString();
        if (old) {
          row.id = old.id; row.code = old.code || nextCode('IMP', date.replace(/-/g, ''));
          if (JSON.stringify([old.cat,old.qty,old.unit,old.price,old.reason]) === JSON.stringify([row.cat,row.qty,row.unit,row.price,row.reason])) skipped++;
          else { row.photos = old.photos || []; row.batchId = ''; row.apprStatus = ''; Object.assign(old, row); updated++; }  /* 內容改變 → 需重新核可 */
        } else { row.code = nextCode('IMP', date.replace(/-/g, '')); DB.push(row); added++; }
        importedDates[row.date] = true;

/* 保安服務費表的期間：從表頭 MONTH、工作表名、檔名推年月。
   只有月份沒有年份時，取「最接近今天」的年份（例如 1 月匯入 12 月 → 去年）。 */
function feePeriod(monthCell, sh, now) {
  now = now || new Date();
  var MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  if (typeof monthCell === 'number' && monthCell > 20000) { var d0 = SEC.parseD(monthCell); if (d0) return d0.getFullYear() + '-' + SEC.p2(d0.getMonth() + 1); }
  if (monthCell instanceof Date && !isNaN(monthCell)) return monthCell.getFullYear() + '-' + SEC.p2(monthCell.getMonth() + 1);
  var texts = [String(monthCell == null ? '' : monthCell), String(sh && sh.name || ''), String(sh && sh.fileName || '')], mi = -1, yr = 0;
  for (var i = 0; i < texts.length; i++) {
    var s = texts[i], m;
    if ((m = s.match(/(20\d{2})[-\/.年](0?[1-9]|1[0-2])(?!\d)/))) { if (mi < 0) mi = +m[2] - 1; if (!yr) yr = +m[1]; }
    if (mi < 0 && (m = s.match(/(?:^|[^A-Za-z])(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)(?![A-Za-z])/i))) mi = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
    if (mi < 0 && i === 0 && (m = s.match(/^\s*(0?[1-9]|1[0-2])\s*月?\s*$/))) mi = +m[1] - 1;
    if (!yr && (m = s.match(/(?:^|\D)(20\d{2})(?!\d)/))) yr = +m[1];
    if (!yr && mi >= 0 && i === 0 && (m = s.match(/[-'’\s](\d{2})\s*$/))) yr = 2000 + +m[1];
  }
  if (mi < 0) return '';
  if (!yr) {
    var best = 0, bestDiff = 1e9;
    [now.getFullYear() - 1, now.getFullYear(), now.getFullYear() + 1].forEach(function (y) {
      var diff = Math.abs((y - now.getFullYear()) * 12 + mi - now.getMonth());
      if (diff < bestDiff) { bestDiff = diff; best = y; }
    });
    yr = best;
  }
  return yr + '-' + SEC.p2(mi + 1);
}

    var pg='<b>💰 '+tl(lang,'費用逐筆明細','Expense Details','ព័ត៌មានលម្អិតចំណាយ')+'</b> · '+SEC.esc(p.label())+'\n'+expPre(lines);
    b.forEach(function(r){pg+='\n· '+SEC.esc(r.code||r.id||'—')+' · '+tl(lang,'廠商','Vendor','អ្នកផ្គត់ផ្គង់')+' '+SEC.esc(r.vendor||'—')+' · '+tl(lang,'申請人','Applicant','អ្នកស្នើ')+' '+SEC.esc(r.by||'—')+(r.reason?' · '+tl(lang,'原因','Reason','មូលហេតុ')+' '+SEC.esc(trData(r.reason,lang)):'')+(r.batchId?' · Batch '+SEC.esc(r.batchId):'');});
    var ph=[];b.forEach(function(r){ph=ph.concat(r.photos||[]);});defs.push({text:pg,photos:ph.filter(Boolean).slice(0,4)});}
  return defs;
}
function expenseSummaryPages(st){return expenseSummaryPageDefs(st).map(function(x){return x.text;});}
function expenseSummaryPhotos(st,pageIndex){var d=expenseSummaryPageDefs(st)[pageIndex];return d&&d.photos?d.photos.slice(0,4):[];}
function expenseApprovalItems(st) {
  return securityFeeRows(st).map(approvalItem);
}
function expenseApprovalSent(result, st, items) {
  if (result && result.closed) { SEC.toast('⚠ ' + L('後端回傳已關閉的舊批次，未重新送出。', 'The server returned a closed batch; nothing was sent.', 'ម៉ាស៊ីនមេបានត្រឡប់បាច់ដែលបានបិទ។'), 'warn', 7000); return; }
  markSent(items, result || {}, result && result.route);
  save(); renderAll(); SEC.scheduleAutoCloudSync(TOOL, 'expense-approval-sent', st && st.period || '');
}

function expenseApprovalPreview(st,items){
  var lang=st.lang||'zh',p=expenseSummaryPeriod(st),amt=items.reduce(function(s,x){return s+(+x.amount||0);},0),pc=items.reduce(function(n,x){return n+(Array.isArray(x.photos)?x.photos.length:(x.photo?1:0));},0);
  if(!items.length)return tl(lang,'沒有待送核可的保安服務費。','No security service fee waiting to be sent.','គ្មានថ្លៃសេវាសន្តិសុខរង់ចាំស្នើ។');
  var txt='✅ <b>'+tl(lang,'保安費用核可','Security Expense Approval','ការអនុម័តចំណាយសន្តិសុខ')+'</b> · '+SEC.esc(p.label())+'\n'+expPre(['Field                Value','Records              '+items.length,'Total amount         '+money(amt),'Photos               '+pc]);
  items.slice(0,8).forEach(function(x,i){txt+='\n┌ #'+(i+1)+' '+SEC.esc(x.id||'—')+'\n│ Item      '+SEC.esc(trData(x.name||'—',lang))+'\n│ Date      '+SEC.esc(x.date||'—')+'\n│ Category  '+SEC.esc(catLabel(x.dept||'—',lang))+'\n│ Vendor    '+SEC.esc(x.vendor||'—')+'\n│ Qty       '+SEC.esc((x.qty||0)+' '+trData(x.unit||'',lang))+'\n│ Amount    '+money(x.amount||0)+'\n│ Applicant '+SEC.esc(x.info||'—')+'\n│ Reason    '+SEC.esc(trData(x.reason||'—',lang))+'\n│ Photos    '+(Array.isArray(x.photos)?x.photos.length:(x.photo?1:0))+'\n└';});
  if(items.length>8)txt+='\n… +'+(items.length-8)+' records';return txt;
}
function openExpenseTelegram() {
  var sending = false;
  return SEC.tgOpen({ module:'expense', canApprove:true, defaultType:PER.mode, defaultPeriod:PER.key(), defaultLang:SEC.lang() === 'zh' ? 'both' : SEC.lang(),
    modalTitle:L('Telegram 摘要／保安費核可', 'Telegram summary / fee approval', 'សង្ខេប Telegram / អនុម័តថ្លៃសេវា'),
    approvalLabel:L('保安費核可', 'Security fee approval', 'អនុម័តថ្លៃសេវា'),
    approvalNote:L('未送核或退件的保安服務費會建立新批次；已送出仍待核可的會更新原批次。', 'Unsent or rejected security fees create a new batch; items already pending refresh their batch.', 'ថ្លៃសេវាដែលមិនទាន់ស្នើ ឬបានបដិសេធ នឹងបង្កើតបាច់ថ្មី។'),
    periods:expensePeriods, currentPeriod:function (type) { return new SEC.Period(type, PER.at).key(); },
    summaryPages:expenseSummaryPages, summaryPhotos:expenseSummaryPhotos, approvalItems:expenseApprovalItems, approvalPreview:expenseApprovalPreview,
    approvalTitle:PER.key() + ' ' + L('保安費用', 'Security expense', 'ចំណាយសន្តិសុខ'),
    onApprovalSend:async function (st, items) {
      if (sending || BUSY.send) return null;
      sending = true; BUSY.send = true;
      try {
        var bids = Array.from(new Set(items.map(function (x) { return x.batchId; }).filter(Boolean)));
        if (items.length && bids.length === 1 && items.every(function (x) { return x.batchId === bids[0]; })) {
          return await SEC.gasPost({ action:'approvalResend', batchId:bids[0] });
        }
        return await SEC.sendApproval({ module:'expense', period:st.period, title:PER.key() + ' ' + tl(st.lang === 'both' ? 'zh' : st.lang, '保安費用', 'Security expense', 'ចំណាយសន្តិសុខ'),
          route:SEC.pickedRoute('rp'), lang:st.lang === 'both' ? 'zh' : st.lang, periodType:st.ptype, items:items });
      } finally { sending = false; BUSY.send = false; }
    },
    onApprovalSent:expenseApprovalSent });
}
SEC.registerAutoUploader(TOOL, function (opts) { return doUpload(opts); });
SEC.registerAutoDownloader(TOOL, function (opts) { return doDownload(opts); });
window.addEventListener('load', function () { setTimeout(function () { SEC.startAutoCloudSync(TOOL); }, 350); });
</script>
